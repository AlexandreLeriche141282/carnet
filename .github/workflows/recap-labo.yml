name: Recap labo

on:
  schedule:
    - cron: "5 * * * *"
    - cron: "35 12,13,14,15,16,17 * * *"
  workflow_dispatch:

concurrency:
  group: recap-labo
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Envoyer le récap à l’heure de Paris
        run: node scripts/send-recap.mjs
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

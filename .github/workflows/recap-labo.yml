name: Recap labo

on:
  schedule:
    # Toutes les heures, si l’heure du labo n’est pas 18 h.
    - cron: "10 * * * *"
    # 18 h Paris = 17 h UTC en hiver, 16 h UTC en été.
    - cron: "0,20,40 16,17,18 * * *"
  workflow_dispatch:

concurrency:
  group: recap-labo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Envoyer le récap à l’heure de Paris
        run: node scripts/send-recap.mjs
        env:
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR code comptoir — Carnet de commandes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=76">
  <script src="motion.js?v=8"></script>
</head>
<body class="site test-page">
  <div class="wrap">
    <header class="top">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo-carnet.svg?v=6" alt="">
        Carnet<span class="brand-dot">.</span>
      </a>
      <nav class="nav">
        <a href="test.html">Procédure</a>
        <a href="commande.html">Page client</a>
      </nav>
    </header>
    <div class="poster">
      <p class="kicker">À coller au comptoir</p>
      <img class="shop-logo-seal qr-poster-logo" src="assets/logo-leonardd.png?v=2" alt="Léonard Boulangerie">
      <h1>Léonard</h1>
      <p class="sub qr-poster-sub">Scannez pour commander</p>
      <img id="qr" alt="QR code de commande">
      <p>Commande · retrait en boutique</p>
      <code id="url"></code>
    </div>
  </div>
  <script>
    const url = new URL("commande.html", window.location.href).href;
    document.getElementById("url").textContent = url;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=" +
      encodeURIComponent(url);
  </script>
</body>
</html>
